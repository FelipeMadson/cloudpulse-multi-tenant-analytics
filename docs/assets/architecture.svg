<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d14" />
      <stop offset="100%" stop-color="#020509" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c28" />
      <stop offset="100%" stop-color="#0d141f" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#canvasBg); stroke: #1e293b; stroke-width: 1.5; rx: 14px; }
    .header-bar { fill: #0d131f; stroke-bottom: #1e293b; }
    .card { fill: url(#cardGrad); stroke: #26354a; stroke-width: 1.2; rx: 8px; }
    .card-active { fill: url(#cardGrad); stroke: #06b6d4; stroke-width: 1.5; rx: 8px; }
    .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
    .text-subtitle { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; fill: #94a3b8; }
    .text-label { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; fill: #64748b; font-weight: 600; }
    .badge { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; font-weight: 700; fill: #38bdf8; }
    .arrow { stroke: #38bdf8; stroke-width: 1.8; stroke-dasharray: 4, 3; fill: none; }
    .arrow-solid { stroke: #06b6d4; stroke-width: 2; fill: none; }
    .pulse-dot { fill: #06b6d4; }
  </style>

  <!-- Container Principal -->
  <g filter="url(#shadow)">
    <rect x="15" y="15" width="930" height="390" rx="14" class="bg" />
    
    <!-- Header -->
    <path d="M 15 29 A 14 14 0 0 1 29 15 L 931 15 A 14 14 0 0 1 945 29 L 945 58 L 15 58 Z" class="header-bar" />
    <circle cx="38" cy="36" r="5" fill="#ef4444" />
    <circle cx="54" cy="36" r="5" fill="#f59e0b" />
    <circle cx="70" cy="36" r="5" fill="#10b981" />
    
    <text x="96" y="40" class="text-title">Cloudpulse Multi Tenant Analytics</text>
    <text x="440" y="40" class="badge">ARQUITETURA &amp; PIPELINE DE DADOS · [ENTERPRISE MULTI-TENANT SAAS ARCHITECTURE]</text>
    <text x="820" y="40" class="text-label">FELIPE MADISON</text>

    <!-- Conteúdo Específico do Arquétipo -->
    
    <!-- 1. Multi-Tenant HTTP Ingestion -->
    <g transform="translate(45, 95)">
      <rect width="180" height="260" class="card" />
      <rect x="0" y="0" width="180" height="32" rx="8" fill="#1e293b" />
      <text x="14" y="21" class="text-title">1. Multi-Tenant Gateway</text>
      <text x="14" y="65" class="text-subtitle">Ingestão Concorrente</text>
      <text x="14" y="90" class="text-label">• Tenant Header / Auth</text>
      <text x="14" y="110" class="text-label">• Token Bucket Limiter</text>
      <text x="14" y="130" class="text-label">• Quota Isolation</text>
      <rect x="14" y="165" width="152" height="70" rx="6" fill="#090d14" stroke="#3b82f6" />
      <text x="24" y="190" class="badge">Tenant Partition</text>
      <text x="24" y="208" class="text-label">Zero cross-tenant leak</text>
      <text x="24" y="223" class="text-label">Taxa: 10k req/min</text>
    </g>

    <path d="M 225 225 L 275 225" class="arrow-solid" />
    <polygon points="275,221 283,225 275,229" fill="#06b6d4" />

    <!-- 2. Streaming Ring Buffer -->
    <g transform="translate(285, 80)">
      <rect width="210" height="290" class="card-active" />
      <rect x="0" y="0" width="210" height="32" rx="8" fill="#1d4ed8" />
      <text x="14" y="21" class="text-title">2. Streaming Ring Buffer</text>
      <text x="14" y="60" class="text-subtitle">Zero-Allocation Buffer</text>

      <rect x="14" y="75" width="182" height="48" rx="4" fill="#090d14" stroke="#3b82f6" />
      <text x="24" y="95" class="text-title" fill="#38bdf8">Circular RingBuffer</text>
      <text x="24" y="112" class="text-label">100.000 slots pré-alocados</text>

      <rect x="14" y="135" width="182" height="48" rx="4" fill="#090d14" stroke="#10b981" />
      <text x="24" y="155" class="text-title" fill="#10b981">Throughput: &gt; 1k ops/s</text>
      <text x="24" y="172" class="text-label">Backpressure Control</text>

      <rect x="14" y="195" width="182" height="48" rx="4" fill="#090d14" stroke="#f59e0b" />
      <text x="24" y="215" class="text-title" fill="#facc15">Janela Deslizante</text>
      <text x="24" y="232" class="text-label">Agregação de 60s contínua</text>
    </g>

    <path d="M 495 225 L 545 225" class="arrow-solid" />
    <polygon points="545,221 553,225 545,229" fill="#06b6d4" />

    <!-- 3. Percentile Calculator (P50/P95/P99) -->
    <g transform="translate(555, 95)">
      <rect width="180" height="260" class="card" />
      <rect x="0" y="0" width="180" height="32" rx="8" fill="#1e293b" />
      <text x="14" y="21" class="text-title">3. Analytics &amp; Percentis</text>
      <text x="14" y="65" class="text-subtitle">Cálculo Estatístico</text>
      
      <text x="14" y="95" class="text-label">P50 Latency</text>
      <text x="14" y="115" class="text-title" fill="#10b981">1.2 ms</text>

      <text x="14" y="145" class="text-label">P95 Latency</text>
      <text x="14" y="165" class="text-title" fill="#38bdf8">3.8 ms</text>

      <text x="14" y="195" class="text-label">P99 Latency</text>
      <text x="14" y="215" class="text-title" fill="#f59e0b">7.1 ms</text>
    </g>

    <path d="M 735 225 L 775 225" class="arrow-solid" />
    <polygon points="775,221 783,225 775,229" fill="#06b6d4" />

    <!-- 4. Prometheus & Dashboard View -->
    <g transform="translate(785, 95)">
      <rect width="130" height="260" class="card" />
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#1e293b" />
      <text x="12" y="21" class="text-title">4. Saída &amp; Métricas</text>
      <text x="12" y="65" class="text-subtitle">Prometheus Exporter</text>
      <text x="12" y="95" class="badge">/metrics</text>
      <text x="12" y="115" class="text-label">OpenMetrics Format</text>
      <text x="12" y="145" class="badge">/health</text>
      <text x="12" y="165" class="text-label">Liveness &amp; Ready</text>
      <text x="12" y="200" class="text-title" fill="#10b981">Canvas 2D</text>
      <text x="12" y="220" class="text-label">Ondas ao Vivo</text>
    </g>
  </g>
</svg>